  <path d="M 748.03,651.16 L 761.26,646.79 L 761.48,622.17 L 806.52,622.17 L 806.74,646.79 L 819.97,651.16 L 819.97,651.16 L 832.41,657.43 L 849.98,640.17 L 881.83,672.02 L 864.57,689.59 L 870.84,702.03 L 870.84,702.03 L 875.21,715.26 L 899.83,715.48 L 899.83,760.52 L 875.21,760.74 L 870.84,773.97 L 870.84,773.97 L 864.57,786.41 L 881.83,803.98 L 849.98,835.83 L 832.41,818.57 L 819.97,824.84 L 819.97,824.84 L 806.74,829.21 L 806.52,853.83 L 761.48,853.83 L 761.26,829.21 L 748.03,824.84 L 748.03,824.84 L 735.59,818.57 L 718.02,835.83 L 686.17,803.98 L 703.43,786.41 L 697.16,773.97 L 697.16,773.97 L 692.79,760.74 L 668.17,760.52 L 668.17,715.48 L 692.79,715.26 L 697.16,702.03 L 697.16,702.03 L 703.43,689.59 L 686.17,672.02 L 718.02,640.17 L 735.59,657.43 L 748.03,651.16 Z" fill="#030812" stroke="#030812" stroke-width="34" stroke-linejoin="round" opacity="0.55" transform="translate(0 12)"/>
  <path d="M 748.03,651.16 L 761.26,646.79 L 761.48,622.17 L 806.52,622.17 L 806.74,646.79 L 819.97,651.16 L 819.97,651.16 L 832.41,657.43 L 849.98,640.17 L 881.83,672.02 L 864.57,689.59 L 870.84,702.03 L 870.84,702.03 L 875.21,715.26 L 899.83,715.48 L 899.83,760.52 L 875.21,760.74 L 870.84,773.97 L 870.84,773.97 L 864.57,786.41 L 881.83,803.98 L 849.98,835.83 L 832.41,818.57 L 819.97,824.84 L 819.97,824.84 L 806.74,829.21 L 806.52,853.83 L 761.48,853.83 L 761.26,829.21 L 748.03,824.84 L 748.03,824.84 L 735.59,818.57 L 718.02,835.83 L 686.17,803.98 L 703.43,786.41 L 697.16,773.97 L 697.16,773.97 L 692.79,760.74 L 668.17,760.52 L 668.17,715.48 L 692.79,715.26 L 697.16,702.03 L 697.16,702.03 L 703.43,689.59 L 686.17,672.02 L 718.02,640.17 L 735.59,657.43 L 748.03,651.16 Z" fill="url(#blue)" stroke="#111d30" stroke-width="16" stroke-linejoin="round"/>
  <circle cx="784" cy="738" r="43" fill="#122038"/>
  <circle cx="784" cy="738" r="23" fill="#233c60"/>
</svg>
