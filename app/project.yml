name: PS5
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig
targets:
  PS5:
    type: application
    productName: PS5 MCP
    platform: macOS
    sources:
      - path: .
        includes:
          - "*.swift"
          - "*.c"
          - "*.h"
      - path: Assets.xcassets
        buildPhase: resources
      - path: ../src/ps5mcp/assets/assign-dialog.png
        buildPhase: resources
      # padd.elf and its build report, staged by the Makefile (empty when the payload was not built).
      - path: ../build/bundle/padd
        type: folder
        buildPhase: resources
      - path: ../build/bundle/remoteplay
        type: folder
        buildPhase: resources
      - path: ../build/bundle/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: PS5 MCP
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # The Makefile passes pyproject.toml's version and the commit count.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: RemotePlayBridge.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../.deps/remoteplay/$(CURRENT_ARCH)/install/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../.deps/remoteplay/$(CURRENT_ARCH)/install/lib"
        OTHER_LDFLAGS: "$(inherited) -lchiaki -lprotobuf-nanopb -ljerasure -lgf_complete -lopus -ljson-c -lminiupnpc -levent -lcurl -lssl -lcrypto -framework CoreServices -framework SystemConfiguration"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        # Filled in by the Makefile: the checkout (padd Start/Stop run its CLI) and uv.
        PS5MCP_REPO: ""
        PS5MCP_UV: ""
